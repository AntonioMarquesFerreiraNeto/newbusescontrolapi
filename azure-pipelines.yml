
trigger:
  branches:
    include:
      - main

pool:
  vmImage: 'ubuntu-latest'

variables:
  buildConfiguration: 'Release'

steps:
  - task: UseDotNet@2
    displayName: 'Instalar .NET SDK'
    inputs:
      packageType: 'sdk'
      version: '10.x'

  - script: dotnet restore
    displayName: 'Restaurar dependências'

  - script: dotnet build --configuration $(buildConfiguration) --no-restore
    displayName: 'Compilar aplicação'

  - script: dotnet publish BusesControl.Api/BusesControl.Api.csproj --configuration $(buildConfiguration) --no-restore --output $(Build.ArtifactStagingDirectory)/publish
    displayName: 'Publicar API'

  - task: PublishPipelineArtifact@1
    displayName: 'Disponibilizar artefato'
    inputs:
      targetPath: '$(Build.ArtifactStagingDirectory)/publish'
      artifact: 'api'
      publishLocation: 'pipeline'

